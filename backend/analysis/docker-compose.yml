version: '3.8'

services:
  analysis_api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: aips_analysis_service
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/datasets:/app/data/datasets
      - ./data/models:/app/data/models
    environment:
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    command: >
      bash -c "mkdir -p /root/.kaggle && echo '{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}' > /root/.kaggle/kaggle.json && chmod 600 /root/.kaggle/kaggle.json && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - analysis_db
      - redis
      - celery_worker

  analysis_db:
    image: postgres:13-alpine
    container_name: aips_analysis_db
    hostname: analysis-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    container_name: aips_analysis_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: aips_analysis_celery
    working_dir: /app
    command: >
      bash -c "mkdir -p /root/.kaggle && echo '{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}' > /root/.kaggle/kaggle.json && chmod 600 /root/.kaggle/kaggle.json && bash /app/entrypoint-celery.sh"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data:/app/data
      - ./analysis:/app/analysis
    tmpfs:
      - /tmp:size=1G
    depends_on:
      - redis
      - analysis_db
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=analysis-db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  postgres_data:

networks:
  aips_analysis_network:
    driver: bridge 