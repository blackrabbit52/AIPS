server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  # Database Configuration
  datasource:
    url: jdbc:postgresql://db:5432/aips_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

# Application Configuration
app:
  # JWT Configuration
  jwtSecret: 9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a7c4d9f1b6e8a
  jwtExpirationInMs: 86400000

# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG
    com.aips.authentication: DEBUG

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization} 