server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  # Database Configuration
  datasource:
    url: jdbc:postgresql://db:5432/aips_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      platform: postgresql
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true

# Application Configuration
app:
  # JWT Configuration
  jwtSecret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  jwtExpirationInMs: 86400000

# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG
    com.aips.authentication: DEBUG
    org.hibernate.SQL: DEBUG

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization} 