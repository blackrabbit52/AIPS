version: '3.8'

services:
  # API Gateway
  api-gateway:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Analysis Service (Django)
  analysis:
    build: 
      context: ./backend/analysis
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/analysis:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=analysis.settings
      - DATABASE_URL=postgresql://postgres:postgres@analysis-db:5432/analysis
      - DEBUG=1
    ports:
      - "8000:8000"
    depends_on:
      analysis-db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

  # Authentication Service (Spring)
  authentication:
    build: 
      context: ./backend/authentication
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/authentication:/app
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=jdbc:postgresql://auth-db:5432/auth
    ports:
      - "8080:8080"
    depends_on:
      auth-db:
        condition: service_healthy

  # Recommendation Service (Flask)
  recommendation:
    build: 
      context: ./backend/recommendation
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/recommendation:/app
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@recommendation-db:5432/recommendation
    ports:
      - "5000:5000"
    depends_on:
      recommendation-db:
        condition: service_healthy
    command: flask run --host=0.0.0.0 --port=5000 --reload

  # Frontend AIPS (React)
  aips:
    build: 
      context: ./aips
      dockerfile: Dockerfile.dev
    volumes:
      - ./aips/src:/app/src
      - ./aips/public:/app/public
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
      - PORT=3000
      - CI=true
    ports:
      - "3000:3000"

  # Databases
  analysis-db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=analysis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - analysis_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=auth
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  recommendation-db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=recommendation
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - recommendation_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Elasticsearch for search
  elasticsearch:
    image: elasticsearch:7.9.3
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status.*green'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  analysis_db_data:
  auth_db_data:
  recommendation_db_data:
  aips_node_modules: 