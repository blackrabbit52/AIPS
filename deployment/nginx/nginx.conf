events {
    worker_connections 1024;
}

http {
    upstream analysis_service {
        server analysis:8000;
    }

    upstream authentication_service {
        server authentication:8080;
    }

    upstream recommendation_service {
        server recommendation:5000;
    }

    upstream frontend {
        server aips:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # CORS configuration
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        # Analysis Service
        location /api/analysis/ {
            proxy_pass http://analysis_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Authentication Service
        location /api/auth/ {
            proxy_pass http://authentication_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Recommendation Service
        location /api/recommend/ {
            proxy_pass http://recommendation_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
} 